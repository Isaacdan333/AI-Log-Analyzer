[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecurity-log-analyzer"
version = "0.1.0"
description = "A rule-based cybersecurity log analyzer"
readme = "plan.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "scikit-learn>=1.7,<2",
]
ml = [
    "scikit-learn>=1.7,<2",
]

[project.scripts]
loganalyzer = "loganalyzer.cli:main"

[tool.setuptools.packages.find]
include = ["loganalyzer*"]
